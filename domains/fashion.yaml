# Fashion Ecosystem
# Domain = semantic cluster / Repo = responsibility / Capability = reusable connection

id: fashion
name: Fashion Ecosystem
version: "0.1"
description: >
  Apparel, textile, accessories, customization and fashion production ecosystem.
  Repositories remain independently responsible while this registry connects
  their semantic roles, capabilities, providers, workflows and evidence.

principles:
  repo: responsibility
  domain: semantic_cluster
  capability: reusable_connection
  provider: production_capability
  product: business_output
  workflow: executable_process
  evidence: observed_outcome

repos:
  socks:
    repo: bonsai/socks
    role: product
    capabilities:
      - one_point_embroidery
      - small_lot_production
      - customization
  aloha:
    repo: bonsai/aloha
    role: apparel_product
    capabilities:
      - apparel_design
      - pattern_design
      - customization
  textile:
    repo: bonsai/textile
    role: production_ir
    capabilities:
      - textile_representation
      - production_design
  costume_generation:
    repo: bonsai/costume-generation
    role: design_composition
    capabilities:
      - costume_generation
      - garment_composition
      - design_to_production
  shishu:
    repo: bonsai/shishu
    role: embroidery_specialization
    capabilities:
      - embroidery
      - stitch_design
      - embroidery_ir
  amimono:
    repo: bonsai/amimono
    role: knitting_specialization
    capabilities:
      - knitting
      - knitting_pattern
      - knitting_ir
  oem:
    repo: bonsai/oem
    role: manufacturing_provider_registry
    capabilities:
      - oem
      - supplier_matching
      - production_estimation

capabilities:
  design:
    - costume_generation
    - apparel_design
    - pattern_design
  textile:
    - textile_representation
    - fabric_selection
    - production_design
  customization:
    - embroidery
    - knitting
    - one_point_embroidery
    - name_customization
  manufacturing:
    - oem
    - small_lot_production
    - supplier_matching
  commerce:
    - product_listing
    - ecommerce
    - fulfillment

providers:
  registry: bonsai/oem
  external:
    - factories
    - embroidery_shops
    - knitting_shops
    - textile_manufacturers
    - printing_vendors

products:
  - socks
  - aloha_shirt
  - embroidered_goods
  - knitted_goods
  - custom_apparel
  - costume

workflows:
  custom_apparel:
    input:
      - idea
      - image
      - text
      - customer_preferences
    steps:
      - semanticize
      - design
      - select_material
      - select_production_method
      - match_provider
      - estimate_cost
      - produce
      - inspect
      - deliver
    output:
      - product
      - cost
      - lead_time
      - quality_evidence

  doodle_to_socks:
    input:
      - child_doodle
    steps:
      - image_to_vector
      - simplify_for_embroidery
      - generate_stitch_design
      - select_sock
      - match_oem
      - produce
      - inspect
    output:
      - embroidered_socks
      - production_evidence

  garment_to_embroidery:
    input:
      - garment
      - motif
    steps:
      - semanticize_motif
      - convert_to_embroidery_ir
      - estimate_stitch_count
      - match_provider
      - produce
      - inspect
    output:
      - embroidered_garment

ontology:
  entities:
    - garment
    - textile
    - fabric
    - motif
    - embroidery
    - knitting
    - pattern
    - stitch
    - manufacturer
    - provider
    - product
    - customer
    - order
  relations:
    - type: made_from
      from: product
      to: textile
    - type: decorated_with
      from: garment
      to: motif
    - type: produced_by
      from: product
      to: provider
    - type: specializes_in
      from: provider
      to: capability
    - type: implements
      from: repo
      to: capability
    - type: derived_from
      from: production_ir
      to: product

synapse:
  role: weighted_relationships
  nodes:
    - repos
    - capabilities
    - providers
    - products
    - workflows
  examples:
    - from: costume-generation
      to: textile
      relation: design_to_production
    - from: textile
      to: shishu
      relation: embroidery_adapter
    - from: textile
      to: amimono
      relation: knitting_adapter
    - from: product
      to: oem
      relation: production_provider
    - from: socks
      to: shishu
      relation: embroidery_production

matrix:
  role: computation
  inputs:
    - product_features
    - textile_features
    - provider_features
    - cost_features
    - lead_time_features
    - quality_features
  outputs:
    - product_vector
    - provider_vector
    - match_score
    - cost_estimate
    - production_score

bqml:
  role: learning
  training_features:
    - product_features
    - provider_features
    - cost_features
    - lead_time_features
    - quality_features
    - historical_outcomes
  models:
    provider_matching:
      type: regression
      output: provider_match_score
    cost_prediction:
      type: regression
      output: expected_cost
    lead_time_prediction:
      type: regression
      output: expected_lead_time
    quality_prediction:
      type: regression
      output: expected_quality
    product_clustering:
      type: kmeans
      output: product_cluster
  feedback:
    - production_result
    - actual_cost
    - actual_lead_time
    - quality_result
    - customer_feedback

agents:
  design:
    role: design_agent
    capabilities:
      - costume_generation
      - apparel_design
  production:
    role: production_planner
    capabilities:
      - provider_matching
      - cost_estimation
      - lead_time_estimation
  embroidery:
    role: embroidery_agent
    capabilities:
      - embroidery
      - stitch_design
  knitting:
    role: knitting_agent
    capabilities:
      - knitting
      - knitting_pattern
  oem:
    role: oem_agent
    capabilities:
      - supplier_matching
      - production_estimation

execution:
  orchestrator: bonsai/aw
  interfaces:
    - mcp
    - cli
    - workflow
  production_boundary:
    - external_factory
    - external_vendor

learning_loop:
  - observe_customer_request
  - semanticize
  - design
  - calculate
  - match_provider
  - execute
  - observe_result
  - store_evidence
  - train_bqml
  - update_weights
  - improve_matching

architecture: |
  Customer / Market
         |
         v
      Fashion
         |
    +----+----+----------------+
    |         |                |
  Design   Textile        Customization
    |         |           /       \
    |         |       Shishu      Amimono
    +---------+------------+-------+
              |
              v
           Matrix
              |
              v
          Provider
          /       \
        OEM      Factory
          \       /
              |
              v
           Product
              |
              v
           Outcome
              |
              v
           BigQuery
              |
              v
            BQML
              |
              v
        learned weights
              |
              +------> Matrix

boundaries:
  fashion: owns the semantic domain cluster
  repositories: own implementation responsibilities
  oem: owns provider/manufacturing knowledge
  matrix: owns computation
  bigquery: owns analytical history
  bqml: owns learned models
  agents: own decisions and coordination
  aw: owns execution orchestration
  external_vendors: own physical production

governance:
  observed: production_fact
  inferred: model_result
  proposed: candidate_relationship_or_capability
  validated: reviewed_domain_structure
  declared: fashion_ontology

core_principle: >
  Fashion is not one repository. It is a semantic ecosystem connecting
  independently responsible repositories, reusable capabilities, providers,
  products, workflows and evidence. BQML learns from the ecosystem but does
  not become its source of truth.
