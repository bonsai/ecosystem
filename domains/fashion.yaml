# Fashion domain registry
# Domain = semantic cluster / Repo = responsibility / Capability = reusable skill
# Provider = production capability / Workflow = executable process
# WorkType = object2object transformation type
# Evidence = observed outcome / Graph = discovered relationship

api_version: "v1"
id: fashion
name: Fashion Ecosystem
version: "0.3"
description: >
  Apparel, textile, accessories, customization and fashion production.
  This file is a semantic registry, not an implementation repository.

principles:
  repo: responsibility
  domain: semantic_cluster
  capability: reusable_connection
  provider: production_capability
  product: business_output
  workflow: executable_process
  worktype: object2object_transformation
  evidence: observed_outcome
  model: learned_estimate

repos:
  bonsai/socks:
    role: product
    capabilities: [one_point_embroidery, small_lot_production, customization]
  bonsai/aloha:
    role: apparel_product
    capabilities: [apparel_design, pattern_design, customization]
  bonsai/textile:
    role: production_ir
    capabilities: [textile_representation, production_design]
  bonsai/costume-generation:
    role: design_composition
    capabilities: [costume_generation, garment_composition, design_to_production]
  bonsai/shishu:
    role: embroidery_specialization
    capabilities: [embroidery, stitch_design, embroidery_ir]
  bonsai/amimono:
    role: knitting_specialization
    capabilities: [knitting, knitting_pattern, knitting_ir]
  bonsai/oem:
    role: manufacturing_provider_registry
    capabilities: [oem, supplier_matching, production_estimation]

capabilities:
  design: [costume_generation, apparel_design, pattern_design]
  textile: [textile_representation, fabric_selection, production_design]
  customization: [embroidery, knitting, one_point_embroidery, name_customization]
  manufacturing: [oem, small_lot_production, supplier_matching]
  commerce: [product_listing, ecommerce, fulfillment]

providers:
  registry: bonsai/oem
  types: [factory, embroidery_shop, knitting_shop, textile_manufacturer, printing_vendor]

products:
  - socks
  - aloha_shirt
  - embroidered_goods
  - knitted_goods
  - custom_apparel
  - costume

workflows:
  custom_apparel:
    input: [idea, image, text, customer_preferences]
    steps: [semanticize, design, select_material, select_production_method, match_provider, estimate_cost, produce, inspect, deliver]
    output: [product, cost, lead_time, quality_evidence]
  doodle_to_socks:
    input: [child_doodle]
    steps: [image_to_vector, simplify_for_embroidery, generate_stitch_design, select_sock, match_oem, produce, inspect]
    output: [embroidered_socks, production_evidence]
  garment_to_embroidery:
    input: [garment, motif]
    steps: [semanticize_motif, convert_to_embroidery_ir, estimate_stitch_count, match_provider, produce, inspect]
    output: [embroidered_garment]

# WorkType ontology: every executable workflow transformation is expressed as Object -> Object.
# WorkType is the reusable type; a Task is an execution instance of a WorkType.
worktype:
  id: object2object
  name: Object2Object WorkType
  description: >
    A reusable work type that transforms, generates, connects, updates,
    aggregates, infers, or validates one object into another object.
  input:
    type: object
  output:
    type: object
  operations:
    - transform
    - generate
    - connect
    - update
    - aggregate
    - infer
    - validate
  relations:
    transforms: [object, object]
    instantiated_as: [worktype, task]
    executed_by: [task, agent]
    orchestrated_by: [task, aw]
    produces: [task, object]
    evidenced_by: [task, evidence]
  examples:
    commit2journal:
      from: commit
      to: journal
      operation: generate
    journal2history:
      from: journal
      to: history
      operation: aggregate
    repo2cluster:
      from: repository
      to: cluster
      operation: infer
    cluster2domain:
      from: cluster
      to: domain
      operation: generate
    domain2repo:
      from: domain
      to: repository
      operation: generate
    domain2synapse:
      from: domain
      to: synapse
      operation: generate
    issue2task:
      from: issue
      to: task
      operation: transform

ontology:
  entities:
    - garment
    - textile
    - fabric
    - motif
    - embroidery
    - knitting
    - pattern
    - stitch
    - manufacturer
    - provider
    - capability
    - product
    - customer
    - order
    - workflow
    - worktype
    - task
    - agent
    - evidence
  relations:
    made_from: [product, textile]
    decorated_with: [garment, motif]
    produced_by: [product, provider]
    specializes_in: [provider, capability]
    implements: [repo, capability]
    derived_from: [product, production_ir]
    executes: [agent, workflow]
    has_worktype: [workflow, worktype]
    instantiates: [task, worktype]
    transforms: [worktype, object]
    validated_by: [relationship, evidence]

graph:
  role: discovered_and_declared_relationships
  edges:
    - [bonsai/costume-generation, bonsai/textile, design_to_production]
    - [bonsai/textile, bonsai/shishu, embroidery_adapter]
    - [bonsai/textile, bonsai/amimono, knitting_adapter]
    - [product, bonsai/oem, production_provider]
    - [bonsai/socks, bonsai/shishu, embroidery_production]
  discovery:
    sources: [repo_metadata, readme, topics, dependencies, workflows, issues]
    status: [observed, inferred, proposed, validated]

computation:
  matrix:
    inputs: [product_features, textile_features, provider_features, cost_features, lead_time_features, quality_features]
    outputs: [product_vector, provider_vector, match_score, cost_estimate, production_score]

learning:
  engine: bqml
  features: [product_features, provider_features, cost_features, lead_time_features, quality_features, historical_outcomes]
  models:
    provider_matching: {type: regression, output: provider_match_score}
    cost_prediction: {type: regression, output: expected_cost}
    lead_time_prediction: {type: regression, output: expected_lead_time}
    quality_prediction: {type: regression, output: expected_quality}
    product_clustering: {type: kmeans, output: product_cluster}
  feedback: [production_result, actual_cost, actual_lead_time, quality_result, customer_feedback]

agents:
  design: {role: design_agent, capabilities: [costume_generation, apparel_design]}
  production: {role: production_planner, capabilities: [provider_matching, cost_estimation, lead_time_estimation]}
  embroidery: {role: embroidery_agent, capabilities: [embroidery, stitch_design]}
  knitting: {role: knitting_agent, capabilities: [knitting, knitting_pattern]}
  oem: {role: oem_agent, capabilities: [supplier_matching, production_estimation]}

execution:
  orchestrator: bonsai/aw
  interfaces: [mcp, cli, workflow]
  responsibilities:
    router: select_workflow_and_agents
    generator: generate_repo_or_workflow_candidates
    executor: run_validated_workflows
  production_boundary: [external_factory, external_vendor]

learning_loop:
  - observe_customer_request
  - semanticize
  - discover_relationships
  - design
  - calculate
  - match_provider
  - execute
  - observe_result
  - store_evidence
  - train_bqml
  - update_weights
  - improve_matching

boundaries:
  domain: owns_semantic_registry
  repositories: own_implementation_responsibilities
  oem: owns_provider_and_manufacturing_knowledge
  matrix: owns_feature_computation
  bigquery: owns_analytical_history
  bqml: owns_learned_models
  agents: own_decisions_and_coordination
  aw: owns_routing_generation_and_execution
  external_vendors: own_physical_production

governance:
  observed: production_fact
  inferred: model_result
  proposed: candidate_relationship_or_capability
  validated: reviewed_domain_structure
  declared: fashion_ontology
  source_of_truth: domain_yaml

architecture: |
  Customer / Market
         |
         v
      Fashion Domain
         |
    +----+----+----------------+
    |         |                |
  Design   Textile        Customization
    |         |           /       \
    |         |       Shishu      Amimono
    +---------+------------+-------+
              |
              v
           Matrix
              |
              v
        Provider Registry
              |
              v
           Product
              |
              v
           Evidence
              |
              v
        BigQuery / BQML
              |
              v
        Learned Weights
              |
              +------> Matrix

core_principle: >
  Fashion is a semantic ecosystem, not one repository. Domain YAML declares
  stable meaning and validated relationships; WorkType defines reusable
  object-to-object work; repositories implement responsibilities; AW routes
  and executes tasks; BQML learns from evidence but never replaces the domain
  source of truth.
