# Idol domain registry
# Issue = action / Code = implementation / DB = canonical data / Research = empirical study

api_version: "v1"
id: idol
name: Idol Ecosystem
version: "0.4"
description: >
  Evidence-based theory stays in idol-lab; executable work is routed to the
  responsible repository, with canonical structured data in idol-db and
  empirical/marketing research in idol-research.

principles:
  repo: responsibility
  domain: semantic_cluster
  capability: reusable_function
  issue: next_action
  code: implementation
  evidence: observed_source
  canonical_data: idol-db

routing:
  theory:
    repo: bonsai/idol-lab
    rule: evidence_based_theorization_only
  data:
    repo: bonsai/idol-db
    rule: canonical_data_crawler_schema_provenance_api
  research:
    repo: bonsai/idol-research
    rule: empirical_research_marketing_analysis_research_code
  music:
    repo: bonsai/idol-playlist
    rule: music_research_playlists
  quiz:
    repo: bonsai/idol-quiz
    rule: quiz_interaction_question_generation
  map:
    repo: bonsai/idol-map
    rule: geographic_graph_visualization
  portal:
    repo: bonsai/idol-portal
    rule: public_pages_navigation_orchestration

issue_policy:
  source_repo: bonsai/idol-lab
  rule: >
    Organize idol-lab Issues, execute the actionable Issue, and route
    implementation/data/research work to the responsible repository. Close
    the source Issue after the handoff is recorded.
  lab_exception: evidence_based_theory_cultural_interpretation_ontology_conceptual_research
  code_policy: skip_in_lab
  data_policy: route_to_idol-db
  research_policy: route_to_idol-research

repos:
  bonsai/idol-lab:
    role: theory_and_cultural_research
    capabilities: [idol_theory, idol_folklore, ontology, cultural_analysis, conceptual_research]
    data_policy: no_canonical_data
    code_policy: no_implementation
  bonsai/idol-research:
    role: empirical_research_and_marketing
    capabilities: [research_design, hypothesis_testing, marketing, analysis, research_code]
    data_policy: consume_canonical_data_from_idol-db
  bonsai/idol-db:
    role: canonical_data_collection_and_api
    capabilities: [database, data_registry, schemas, provenance, crawler, normalization, validation, api]
    data_policy: source_of_truth_for_structured_idol_data
  bonsai/idol-playlist:
    role: music_research_and_playlists
    capabilities: [music_research, playlist, song_data, music_crossover, spotify_research]
  bonsai/idol-quiz:
    role: interaction
    capabilities: [quiz, knowledge_testing, fan_engagement]
  bonsai/idol-map:
    role: geographic_information
    capabilities: [idol_mapping, location_data, local_idol_discovery]
  bonsai/idol-portal:
    role: portal_and_orchestration
    capabilities: [idol_discovery, navigation, aggregation, ecosystem_coordination]
  bonsai/idol-fansite:
    role: fan_site_platform
    capabilities: [fan_site, idol_archive, profile, timeline, live_archive, essays]
  bonsai/idol-live:
    role: live_information
    capabilities: [live_search, event_data, schedule, venue_data]
  bonsai/idol-produce:
    role: production_simulation
    capabilities: [idol_produce, decision_simulation, management_game]
  bonsai/idol-banduke:
    role: ranking
    capabilities: [ranking, comparison, banduke_data]
  bonsai/idol-oshare:
    role: fashion_and_style
    capabilities: [idol_fashion, styling, appearance_data]

architecture:
  theory_to_research: bonsai/idol-lab -> bonsai/idol-research
  research_to_data: bonsai/idol-research -> bonsai/idol-db
  data_to_research: bonsai/idol-db -> bonsai/idol-research
  music_to_data: bonsai/idol-playlist -> bonsai/idol-db
  crawler_to_data: bonsai/idol-db -> bonsai/idol-db
  data_to_apps: bonsai/idol-db -> [bonsai/idol-live, bonsai/idol-fansite, bonsai/idol-map, bonsai/idol-banduke]
  orchestration: bonsai/aw -> ecosystem workflows

workflows:
  issue_handoff:
    input: [idol_lab_issue]
    steps: [classify, route, create_target_issue, execute_target_issue, close_source_issue]
    rule: do_not_implement_out_of_scope_code_in_idol_lab
  research_cycle:
    input: [research_question, hypothesis]
    steps: [design, request_data_from_idol_db, analyze, evaluate, record_insight]
    output: [evidence, evaluation, next_hypothesis]
  idol_registry:
    input: [repository, source, idol_candidate]
    steps: [observe, crawl, normalize, validate, register_in_idol_db, connect]
    output: [idol_record, relationship_evidence]

sources:
  policy:
    - Keep source URLs with factual records.
    - Canonical structured records belong in idol-db.
    - Crawlers that create canonical records belong in idol-db.
    - Research repositories consume canonical data and preserve provenance.
    - Do not promote unverified claims to canonical facts.
    - Distinguish observed, inferred, proposed, validated, and declared data.

governance:
  observed: source_or_repository_fact
  inferred: analytical_result
  proposed: candidate_relationship
  validated: reviewed_domain_structure
  declared: idol_ontology
  source_of_truth: domains/idol.yaml

core_principle: >
  Idol is a semantic ecosystem, not one application. Idol-lab is the theory
  layer; actionable implementation and structured data are routed to the
  responsible repositories, especially idol-db and idol-research.
